<html>
<head>
<title>LA PUBLICIDAD DEL COQUITO</title>
<style>

*{
    margin:0px;
    padding:0px;
}
body{
    background:black;
}
.contenedor{

    width:400px;
    height:700px;
    background-color: yellow;
    margin:auto;
    position:relative;
    overflow:hidden;
}
.volver{
    position: fixed;
    top: 5px;
    left: 20px; 
    width: 140px;   
    height: 40px;   
    background: linear-gradient(45deg, #2563eb, #38bdf8);
    color: white;
    text-decoration: none;
    text-align: center;
    line-height: 40px; 
    font-size: 16px;   
    font-family: Arial;
    border-radius: 12px;
    transition: 0.4s;
    box-shadow: 0px 8px 15px rgba(0,0,0,0.4);
    z-index: 10;
}

.volver:hover{
    background: linear-gradient(45deg, #1d4ed8, #0ea5e9);
    transform: scale(1.1);
    box-shadow: 0px 12px 20px rgba(0,0,0,0.6);
}

.rama{

    width:430px;
    height:500px;
    background-image:url(img/palmerita.png);
    background-size:cover;
    position:absolute;
    left:120px;
    top:-170px;
    animation:rama 3s infinite alternate;
}
.coco1{

    width:110px;
    height:110px;
    background-image:url(img/coco.png);
    background-size:cover;
    position:absolute;
    left:10px;
    top:-150px;
    animation:coco1 4s forwards;
}
.coco2{

    width:130px;
    height:130px;
    background-image:url(img/COCO3.png);
    background-size:cover;
    position:absolute;
    left:120px;
    top:-180px;
    animation:coco2 4s forwards;
    animation-delay:1s;
}
.coco3{

    width:120px;
    height:120px;
    background-image:url(img/coquito.png);
    background-size:cover;
    position:absolute;
    left:250px;
    top:-200px;
    animation:coco3 4s forwards;
    animation-delay:2s;
}

/*las ricas animaciones como al profe le gusta xd (de imagenes)*/
@keyframes rama{

    from{
        transform:rotate(8deg);
    }
    to{
        transform:rotate(18deg);
    }
}

@keyframes coco1{

    0%{
        top:-150px;
    }
    50%{
        top:250px;
        transform:rotate(-10deg);
    }
    100%{
        top:800px;
        transform:rotate(20deg);
    }
}

@keyframes coco2{

    0%{
        top:-180px;
    }
    50%{
        top:300px;
        transform:rotate(10deg);
    }
    100%{
        top:800px;
        transform:rotate(-20deg);
    }
}

@keyframes coco3{

    0%{
        top:-180px;
        transform:rotate(0deg);
    }
    50%{
        top:280px;
        transform:rotate(10deg);
    }
    100%{
        top:800px;
        transform:rotate(-15deg);
    }
}
/*textitos :3*/
.texto1{

    position:absolute;
    top:220px;
    left:-400px;
    width:100%;
    text-align:center;
    font-size:30px;
    font-family:Arial;
    font-weight:bold;
    color:#5a2d00;
    animation:texto1 1s forwards;
}
.texto2{

    position:absolute;
    top:300px;
    left:-500px;
    width:100%;
    text-align:center;
    font-size:50px;
    font-family:Arial;
    font-weight:bold;
    color:white;
    line-height:1.1;
    animation:texto2 1s forwards;
    animation-delay:1s;
}
.texto3{

    position:absolute;
    top:180px;
    right:-600px;
    width:100%;
    text-align:center;
    font-size:95px;
    font-family:Arial;
    font-weight:bold;
    color:white;
    letter-spacing:5px;
    animation:cocoTexto 4s forwards;
    animation-delay:5s;
}
.texto4{

    position:absolute;
    top:300px;
    right:-600px;
    width:100%;
    text-align:center;
    font-size:70px;
    font-family:Arial;
    font-weight:bold;
    color:#5a2d00;
    z-index:1;
    animation:masTexto 2s forwards;
    animation-delay:5s;
}
.texto5{

    position:absolute;
    top:390px;
    right:-600px;
    width:100%;
    text-align:center;
    font-size:80px;
    font-family:Arial;
    font-weight:bold;
    color:white;
    letter-spacing:4px;
    animation:vainillaTexto 4s forwards;
    animation-delay:5s;
}
.aviso{

    animation:desaparecer 1s forwards;
    animation-delay:4s;
}

@keyframes texto1{
    from{
        left:-400px;
    }
    to{
        left:0px;
    }
}

@keyframes texto2{
    from{
        left:-500px;
    }
    to{
        left:0px;
    }
}

@keyframes desaparecer{
    from{
        opacity:1;
    }
    to{
        opacity:0;
    }
}

@keyframes cocoTexto{

    0%{
        right:-600px;
        top:180px;
    }
    40%{
        right:0px;
        top:180px;
    }
    100%{
        right:0px;
        top:90px;
    }
}

@keyframes masTexto{

    from{
        right:-600px;
    }
    to{
        right:0px;
    }
}

@keyframes vainillaTexto{

    0%{
        right:-600px;
        top:390px;
    }
    40%{
        right:0px;
        top:390px;
    }
    100%{
        right:0px;
        top:500px;
    }
}
.ultimococo{

    width:320px;
    height:320px;
    background-image:url(img/final.png);
    background-size:cover;
    position:absolute;
    left:40px;
    top:180px;
    opacity:0;
    z-index:999;
    animation:final 2s forwards;
    animation-delay:7s;
}
@keyframes final{

    0%{
        opacity:0;
        transform:scale(0);
    }
    70%{
        opacity:1;
        transform:scale(1.15);
    }
    100%{
        opacity:1;
        transform:scale(1);
    }
}

.flor{

    width:110px;
    height:110px;
    background-image:url(img/flor.png);
    background-size:cover;
    position:absolute;
    top:400px;
    left:230px;
    opacity:0;
    z-index:1000;
    animation:flor 2s forwards;
    animation-delay:7.2s;
}

@keyframes flor{

    from{
        opacity:0;
        transform:scale(0) rotate(0deg);
    }
    to{
        opacity:1;
        transform:scale(1) rotate(360deg);
    }
}

</style>
</head>
<body>
<div class="contenedor">
    <div class="rama"></div>
    <div class="coco1"></div>
    <div class="coco2"></div>
    <div class="coco3"></div>
    <div class="aviso">
    <div class="texto1">YA PROBASTE </div>
    <div class="texto2"> EL NUEVO SABOR<br></div>
    </div>
    <div class="texto3"> COCO</div>
    <div class="texto4"> +</div>
    <div class="texto5"> VAINILLA</div>
    <div class="ultimococo"></div>
    <div class="flor"></div>

</div>
<a href="index.html" class="volver"> VOLVER</a>
</body>
</html>
