<html>
<head>
    <title>Animaciones CS3</title>
    <style>
        *{
            margin:0px;
            padding:0px;
        }
        .contenedor{
            width:400px;
            height: 200px;
            border:1px solid black;
            position:relative;/*provoca el centrado del div contenedor*/
            margin: 0 auto;/*provoca el centrado del div contenedor*/
            overflow:hidden;
            background-image: url(img/campo.avif);
            background-size: cover;
        }
        .volver{
            position: fixed;
            top: 5px;
            left: 20px; 
            width: 140px;   
            height: 40px;   
            background: linear-gradient(45deg, #2563eb, #38bdf8);
            color: white;
            text-decoration: none;
            text-align: center;
            line-height: 40px; 
            font-size: 16px;   
            font-family: Arial;
            border-radius: 12px;
            transition: 0.4s;
            box-shadow: 0px 8px 15px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .volver:hover{
            background: linear-gradient(45deg, #1d4ed8, #0ea5e9);
            transform: scale(1.1);
            box-shadow: 0px 12px 20px rgba(0,0,0,0.6);
        }
        .cuadrito{
            width: 50px;
            height: 50px;
            position:absolute;
            left:-100px;
            top:50px;
            animation: cuadrito 3s infinite;
        }
        .cuadrito2{
            width: 50px;
            height: 50px;
            position:absolute;
            left:-100px;
            top:50px;
            animation: cuadrito2 5s infinite 1s; 
        }
        @keyframes cuadrito{
            0%{
                left:-50px;
                top:150px;
                rotate:0deg;
            }
            50%{
                left:175px;
                top:0px;
                rotate:60deg;
            }
            100%{
                left:400px;
                top:150px;
                rotate:0deg;
            }

        }
        @keyframes cuadrito2{
           0%{
                left:-50px;
                top:0px;
                rotate:0deg;
            }
            50%{
                left:175px;
                top:150px;
                rotate:60deg;
            }
            100%{
                left:400px;
                top:0px;
                rotate:0deg;
            } 
        } 
        .cuadrito img{
            width: 50%;
            height: 50%;
        } 
        .cuadrito2 img{
           width: 50%;
            height: 50%; 
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="cuadrito"> <img src="img/abeja.webp" alt=""></div>
        <div class="cuadrito2"> <img src="img/abejita.webp" alt=""></div>
    </div>
    <a href="index.html" class="volver"> VOLVER</a>
</body>
</html>
