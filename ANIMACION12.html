<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animación 12 - Blender</title>

<style>

body{
    margin:0;
    background:#0f172a;
    font-family:Arial;
    color:white;
    text-align:center;
}

h1{
    margin-top:30px;
    font-size:45px;
    color: red;
}


video{
    display: block;
    margin: 30px auto;
    width: 600px;
    max-width: 95%;
    height: auto;
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(0,0,0,.6);
}

.volver{
    position: fixed;
    top: 5px;
    left: 20px; 
    width: 140px;   
    height: 40px;   
    background: linear-gradient(45deg, #2563eb, #38bdf8);
    color: white;
    text-decoration: none;
    text-align: center;
    line-height: 40px; 
    font-size: 16px;   
    font-family: Arial;
    border-radius: 12px;
    transition: 0.4s;
    box-shadow: 0px 8px 15px rgba(0,0,0,0.4);
    z-index: 10;
}

    .volver:hover{
    background: linear-gradient(45deg, #1d4ed8, #0ea5e9);
    transform: scale(1.1);
    box-shadow: 0px 12px 20px rgba(0,0,0,0.6);
}
    

</style>

</head>
<body>

<a href="index.html" class="volver">← Volver</a>

<h1>Video realizado en Blender 3D</h1>

<video controls autoplay muted loop>

    <source src="video con blender/blender.mp4" type="video/mp4">

   

</video>

</body>
</html>
